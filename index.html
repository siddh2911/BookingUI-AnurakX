<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: ['selector', '[data-theme="night"]'],
    theme: {
      extend: {
        colors: {
          slate: {
            50: 'rgba(var(--color-slate-50), <alpha-value>)',

<script>
  window.addEventListener('error', function (event) {
    document.body.innerHTML += '<div style="position:fixed;top:0;left:0;background:red;color:white;z-index:9999;padding:20px;">' + event.message + '<br>' + event.filename + ':' + event.lineno + '<br><pre>' + event.error.stack + '</pre></div>';
  });
  window.addEventListener('unhandledrejection', function (event) {
    document.body.innerHTML += '<div style="position:fixed;top:0;left:0;background:red;color:white;z-index:9999;padding:20px;">' + event.reason + '</div>';
  });

  // Default to daylight theme; user can toggle manually
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', 'day');
  }
  applyTheme();
  // React's useTheme hook will take over from here
</script>
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"

<style>
  :root[data-theme="day"] {

    --color-slate-700: 203, 213, 225;

    --color-slate-500: 120, 130, 150;

    --color-slate-300: 45, 50, 65;
    --color-slate-200: 30, 34, 45;
    --color-slate-100: 18, 20, 28;
    --color-slate-50: 8, 8, 12;
    /* True black for backgrounds */
    --color-white: 12, 12, 16;
    --color-black: 255, 255, 255;
  }

  /* Make sure transitions apply to everything that changes color */
  * {
    transition: background-color 1.5s ease, color 1.5s ease, border-color 1.5s ease;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(var(--color-slate-100), 1);
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(var(--color-slate-400), 1);
    border-radius: 3px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(var(--color-slate-500), 1);
  }
</style>
